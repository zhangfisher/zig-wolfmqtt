                    <label class="form-label">主题</label>
                    <input
                        type="text"
                        class="form-input"
                        id="subTopicInput"
                        placeholder="例如: test/topic/#"
                    />
                </div>
                <div class="form-group" style="margin-bottom: 12px">
                    <label class="form-label">QoS</label>
                    <select class="form-select" id="subQosInput">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button class="btn btn-secondary" id="cancelSubBtn">
                        取消
                    </button>
                    <button class="btn btn-primary" id="confirmSubBtn">
                        确认
                    </button>
                </div>
            </div>
        </div>

        <script>
            // ==================== 配置信息 ====================
            const CONFIG = {
                brokerUrl: "ws://192.168.116.217:8080/mqtt",
                apiUrl: "http://192.168.116.217:8080",
                username: "admin",
                password: "22182666",
                autoConnect: true,
            };

            // ==================== 应用状态 ====================
            let state = {
                connected: false,
                connecting: false,
                manualDisconnect: false,
                mqttClient: null,
                currentModule: "home",
                theme: "light",
                stats: {},
                logs: [],
                clients: new Map(),
                subscriptions: [],
                messages: [],
                config: {},
                topicHistory: new Set(),
            };

            // ==================== 工具函数 ====================
            function formatBytes(bytes) {
                if (bytes === 0) return "0 B";
                const k = 1024;
                const sizes = ["B", "KB", "MB", "GB"];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return (
                    parseFloat((bytes / Math.pow(k, i)).toFixed(2)) +
                    " " +
                    sizes[i]
                );
            }

            function formatTime(timestamp) {
                const date = new Date(timestamp);
                return date.toLocaleTimeString("zh-CN", { hour12: false });
            }

            function toHex(bytes) {
                return Array.from(new Uint8Array(bytes))
                    .map((b) => b.toString(16).padStart(2, "0"))
                    .join(" ");
            }

            function getAuthHeader() {
                const credentials = btoa(
                    `${CONFIG.username}:${CONFIG.password}`,
                );
                return `Basic ${credentials}`;
            }

            // ==================== MQTT 客户端 ====================
            function initMqttClient() {
                // 设置连接中状态
                state.connecting = true;
                updateConnectionUI();

                const clientId =
                    "mqtt_" + Math.random().toString(16).substr(2, 8);
                state.mqttClient = mqtt.connect(CONFIG.brokerUrl, {
                    clientId: clientId,
                    username: CONFIG.username,
                    password: CONFIG.password,
                    clean: true,
                    connectTimeout: 10000,
                    reconnectPeriod: state.manualDisconnect ? 0 : 5000, // 人为断开时不重连
                });

                state.mqttClient.on("connect", () => {
                    console.log("MQTT 已连接");
                    state.connected = true;
                    state.connecting = false;
                    updateConnectionUI();
                    showNotification("连接成功", "success");
                    subscribeToSystemTopics();
                });

                state.mqttClient.on("close", () => {
                    console.log("MQTT 已断开");
                    state.connected = false;
                    state.connecting = false;
                    updateConnectionUI();
                });

                state.mqttClient.on("error", (err) => {
                    console.error("MQTT 错误:", err);
                    state.connecting = false;
                    showNotification(`连接失败: ${err.message || "未知错误"}`, "error");
                    updateConnectionUI();
                });

                state.mqttClient.on("message", (topic, message) => {
                    handleMessage(topic, message);
                });
            }

            function subscribeToSystemTopics() {
                if (!state.mqttClient || !state.connected) return;

                // 订阅系统主题
                const systemTopics = [
                    { topic: "$sys/broker/stats", qos: 0 },
                    { topic: "$sys/broker/logs", qos: 0 },
                    { topic: "$sys/broker/clients/connected", qos: 0 },
                    { topic: "$sys/broker/clients/disconnected", qos: 0 },
                ];

                systemTopics.forEach(({ topic, qos }) => {
                    state.mqttClient.subscribe(topic, { qos }, (err) => {
                        if (err) {
                            console.error(`订阅 ${topic} 失败:`, err);
                        }
                    });
                });

                // 重新订阅用户主题
                state.subscriptions.forEach(({ topic, qos, active }) => {
                    if (active) {
                        state.mqttClient.subscribe(topic, { qos }, (err) => {
                            if (err) {
                                console.error(`重新订阅 ${topic} 失败:`, err);
                            }
                        });
                    }
                });
            }

            function handleMessage(topic, message) {
                try {
                    if (topic === "$sys/broker/stats") {
                        const stats = JSON.parse(message.toString());
                        updateStats(stats);
                    } else if (topic === "$sys/broker/logs") {
                        const log = message.toString();
                        addLog(log);
                        addSystemLog(log);
                    } else if (topic === "$sys/broker/clients/connected") {
                        const client = JSON.parse(message.toString());
                        client.connected = true;
                        state.clients.set(client.id, client);
                        updateClientsList();
                    } else if (topic === "$sys/broker/clients/disconnected") {
                        const client = JSON.parse(message.toString());
                        state.clients.delete(client.id);
                        updateClientsList();
                    } else {
                        // 用户订阅的消息
                        const activeSub = state.subscriptions.find((s) =>
                            topic.match(
                                s.topic
                                    .replace("+", "[^/]+")
                                    .replace("#", ".*"),
                            ),
                        );
                        if (activeSub && activeSub.active) {
                            addMessage(topic, message);
                        }
                    }
                } catch (err) {
                    console.error("处理消息时出错:", err);
                }
            }

            // ==================== 统计信息 ====================
            function updateStats(stats) {
                state.stats = stats;

                // 更新活跃连接
                const connsElem = document.getElementById("statConns");
                if (connsElem && stats.conns !== undefined) {
                    connsElem.textContent = stats.conns.toLocaleString();
                }

                // 更新消息统计（接收/发送格式）
                const msgsElem = document.getElementById("statMsgs");
                if (
                    stats.rx_msgs !== undefined &&
                    stats.tx_msgs !== undefined
                ) {
                    msgsElem.textContent =
                        stats.rx_msgs.toLocaleString() +
                        " / " +
                        stats.tx_msgs.toLocaleString();
                }

                // 更新字节统计（接收/发送格式）
                const bytesElem = document.getElementById("statBytes");
                if (
                    stats.rx_bytes !== undefined &&
                    stats.tx_bytes !== undefined
                ) {
                    bytesElem.textContent =
                        formatBytes(stats.rx_bytes) +
                        " / " +
                        formatBytes(stats.tx_bytes);
                }

                // 更新保留消息
                const retainedElem = document.getElementById("statRetained");
                if (retainedElem && stats.retained !== undefined) {
                    retainedElem.textContent = stats.retained.toLocaleString();
                }

                // 更新活跃订阅
                const subsElem = document.getElementById("statSubs");
                if (subsElem && stats.subs !== undefined) {
                    subsElem.textContent = stats.subs.toLocaleString();
                }
            }

            // ==================== 日志功能 ====================
            function addLog(message) {
                state.logs.unshift({
                    time: Date.now(),
                    message: message,
                });

                // 只保留最后 200 条
                if (state.logs.length > 200) {
                    state.logs = state.logs.slice(0, 200);
                }

                updateLogsPanel();
            }

            function updateLogsPanel() {
                const panel = document.getElementById("logsPanel");
                if (state.logs.length === 0) {
                    panel.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                                </svg>
                            </div>
                            <div class="empty-text">暂无日志</div>
                        </div>
                    `;
                    return;
                }

                panel.innerHTML = state.logs
                    .map(
                        (log) => `
                    <div class="log-item">
                        <div class="log-time">${formatTime(log.time)}</div>
                        <div class="log-message">${log.message}</div>
                    </div>
                `,
                    )
                    .join("");
            }

            function clearLogs() {
                state.logs = [];
                updateLogsPanel();
            }

            function addSystemLog(message) {
                // 系统日志与 Broker 日志使用相同的数据源
            }

            function clearSystemLogs() {
                clearLogs();
            }

            // ==================== 客户端管理 ====================
            function updateClientsList() {
                const panel = document.getElementById("clientsPanel");
                const clients = Array.from(state.clients.values());

                if (clients.length === 0) {
                    panel.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                    <line x1="8" x2="8" y1="21" y2="21"/>
                                    <line x1="16" x2="16" y1="21" y2="21"/>
                                </svg>
                            </div>
                            <div class="empty-text">暂无客户端</div>
                        </div>
                    `;
                    return;
                }

                panel.innerHTML = clients
                    .map(
                        (client) => `
                        <div class="client-item">
                            <div class="client-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                                    <line x1="8" x2="8" y1="21" y2="21"/>
                                    <line x1="16" x2="16" y1="21" y2="21"/>
                                </svg>
                            </div>
                            <div class="client-info">
                                <div class="client-id">${client.id}</div>
                                <div class="client-details">
                                    <span>${client.ip}</span>
                                    <span class="client-type">${
                                        client.type === "tcp" ? "TCP" : "WS"
                                    }</span>
                                </div>
                            </div>
                        </div>
                    `,
                    )
                    .join("");
            }

            async function refreshClients() {
                try {
                    const response = await fetch(
                        `${CONFIG.apiUrl}/api/clients`,
                        {
                            headers: {
                                Authorization: getAuthHeader(),
                            },
                        },
                    );

                    if (response.ok) {
                        const clients = await response.json();
                        state.clients.clear();
                        clients.forEach((client) => {
                            client.connected = true;
                            state.clients.set(client.id, client);
                        });
                        updateClientsList();
                    }
                } catch (err) {
                    console.error("刷新客户端列表失败:", err);
                }
            }

            async function kickAllClients() {
                const clients = Array.from(state.clients.values());

                if (clients.length === 0) {
                    alert("没有需要断开的客户端");
                    return;
                }

                const confirmed = confirm(
                    `确定要断开所有 ${clients.length} 个客户端吗？`,
                );
                if (!confirmed) return;

                for (const client of clients) {
                    try {
                        await fetch(`${CONFIG.apiUrl}/api/kick/${client.id}`, {
                            method: "POST",
                            headers: {
                                Authorization: getAuthHeader(),
                            },
                        });
                    } catch (err) {
                        console.error(`断开客户端 ${client.id} 失败:`, err);
                    }
                }
            }

            // ==================== 订阅管理 ====================
            function addSubscription(topic, qos) {
                const exists = state.subscriptions.find(
                    (s) => s.topic === topic,
                );
                if (exists) {
                    alert("该主题已存在");
                    return;
                }

                state.subscriptions.push({ topic, qos, active: true });

                if (state.mqttClient && state.connected) {
                    state.mqttClient.subscribe(topic, { qos }, (err) => {
                        if (err) {
                            console.error(`订阅 ${topic} 失败:`, err);
                            alert(`订阅 ${topic} 失败`);
                        }
                    });
                }

                updateSubscriptionsList();
            }

            function removeSubscription(topic) {
                const index = state.subscriptions.findIndex(
                    (s) => s.topic === topic,
                );
                if (index === -1) return;

                state.subscriptions.splice(index, 1);

                if (state.mqttClient && state.connected) {
                    state.mqttClient.unsubscribe(topic, (err) => {
                        if (err) {
                            console.error(`取消订阅 ${topic} 失败:`, err);
                        }
                    });
                }

                updateSubscriptionsList();
                filterMessages();
            }

            function toggleSubscription(topic) {
                const sub = state.subscriptions.find((s) => s.topic === topic);
                if (sub) {
                    sub.active = !sub.active;

                    if (state.mqttClient && state.connected) {
                        if (sub.active) {
                            state.mqttClient.subscribe(
                                sub.topic,
                                { qos: sub.qos },
                                (err) => {
                                    if (err) {
                                        console.error(
                                            `订阅 ${sub.topic} 失败:`,
                                            err,
                                        );
                                    }
                                },
                            );
                        } else {
                            state.mqttClient.unsubscribe(sub.topic, (err) => {
                                if (err) {
                                    console.error(
                                        `取消订阅 ${sub.topic} 失败:`,
                                        err,
                                    );
                                }
                            });
                        }
                    }

                    updateSubscriptionsList();
                    filterMessages();
                }
            }

            function updateSubscriptionsList() {
                const list = document.getElementById("subscribeList");

                if (state.subscriptions.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <circle cx="12" cy="12" r="10"/>
                                    <line x1="12" x2="12" y1="8" y2="12"/>
                                    <line x1="12" x2="12.01" y1="16" y2="16"/>
                                </svg>
                            </div>
                            <div class="empty-text">暂无订阅</div>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = state.subscriptions
                    .map(
                        (sub) => `
                        <div class="subscribe-item ${sub.active ? "active" : ""}" data-topic="${
                            sub.topic
                        }">
                            <div class="subscribe-checkbox ${sub.active ? "checked" : ""}" data-topic="${
                                sub.topic
                            }">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="20 6 9 17 4 4"></polyline>
                                </svg>
                            </div>
                            <div class="subscribe-content" data-topic="${sub.topic}">
                                <div class="subscribe-topic">${sub.topic}</div>
                                <div class="subscribe-qos">QoS: ${sub.qos}</div>
                            </div>
                            <div class="subscribe-delete" data-topic="${sub.topic}">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 6h18"></path>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                            </div>
                        </div>
                    `,
                    )
                    .join("");

                // 添加事件监听
                list.querySelectorAll(".subscribe-checkbox").forEach(
                    (checkbox) => {
                        checkbox.addEventListener("click", (e) => {
                            e.stopPropagation();
                            const topic = checkbox.dataset.topic;
                            toggleSubscription(topic);
                        });
                    },
                );

                list.querySelectorAll(".subscribe-delete").forEach((delBtn) => {
                    delBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        const topic = delBtn.dataset.topic;
                        if (confirm(`确定删除订阅 "${topic}" 吗？`)) {
                            removeSubscription(topic);
                        }
                    });
                });
            }

            // ==================== 消息管理 ====================
            function addMessage(topic, message) {
                state.messages.unshift({
                    topic,
                    message: message.toString(),
                    time: Date.now(),
                    isBinary: !/^[ -~\t\n\r]+$/.test(message.toString()),
                });

                // 只保留最后 100 条消息
                if (state.messages.length > 100) {
                    state.messages = state.messages.slice(0, 100);
                }

                filterMessages();
            }

            function filterMessages() {
                const activeSubs = state.subscriptions.filter((s) => s.active);
                const list = document.getElementById("messageList");

                let filteredMessages = state.messages;

                if (activeSubs.length > 0) {
                    filteredMessages = state.messages.filter((msg) => {
                        return activeSubs.some((sub) =>
                            msg.topic.match(
                                sub.topic
                                    .replace("+", "[^/]+")
                                    .replace("#", ".*"),
                            ),
                        );
                    });
                }

                if (filteredMessages.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                                </svg>
                            </div>
                            <div class="empty-text">暂无消息</div>
                        </div>
                    `;
                    return;
                }

                list.innerHTML = filteredMessages
                    .map((msg) => {
                        let displayMessage = msg.message;
                        let isHex = false;

                        if (msg.isBinary) {
                            displayMessage = toHex(
                                new TextEncoder().encode(msg.message),
                            );
                            isHex = true;
                        }

                        return `
                            <div class="message-item">
                                <div class="message-avatar">${msg.topic
                                    .split("/")
                                    .pop()
                                    .substring(0, 2)
                                    .toUpperCase()}</div>
                                <div class="message-content">
                                    <div class="message-header">
                                        <div class="message-topic">${msg.topic}</div>
                                        <div class="message-time">${formatTime(msg.time)}</div>
                                    </div>
                                    <div class="message-body ${isHex ? "hex" : ""}">${displayMessage}</div>
                                </div>
                            </div>
                        `;
                    })
                    .join("");
            }

            async function publishMessage() {
                const topic = document
                    .getElementById("publishTopic")
                    .value.trim();
                const qos = parseInt(
                    document.getElementById("publishQos").value,
                );
                const format = document.getElementById("publishFormat").value;
                const retain =
                    document.getElementById("publishRetain").value === "true";
                let payload = document.getElementById("publishPayload").value;

                if (!topic) {
                    alert("请输入主题");
                    return;
                }

                if (!payload) {
                    alert("请输入消息内容");
                    return;
                }

                // 添加到历史记录
                state.topicHistory.add(topic);
                updateTopicHistory();

                // 格式转换
                switch (format) {
                    case "json":
                        try {
                            JSON.parse(payload);
                        } catch {
                            alert("无效的 JSON 格式");
                            return;
                        }
                        break;
                    case "hex":
                        try {
                            const hexString = payload.replace(/\s+/g, "");
                            if (!/^[0-9a-fA-F]*$/.test(hexString)) {
                                throw new Error("无效的十六进制");
                            }
                            const bytes = [];
                            for (let i = 0; i < hexString.length; i += 2) {
                                bytes.push(
                                    parseInt(hexString.substr(i, 2), 16),
                                );
                            }
                            payload =
                                "base64:" +
                                btoa(String.fromCharCode.apply(null, bytes));
                        } catch {
                            alert("无效的十六进制格式");
                            return;
                        }
                        break;
                    case "base64":
                        payload = "base64:" + payload;
                        break;
                }

                try {
                    const url = `${CONFIG.apiUrl}/api/publish/${encodeURIComponent(
                        topic,
                    )}?qos=${qos}&retain=${retain}`;
                    const response = await fetch(url, {
                        method: "POST",
                        headers: {
                            Authorization: getAuthHeader(),
                            "Content-Type": "text/plain",
                        },
                        body: payload,
                    });

                    if (response.ok) {
                        document.getElementById("publishPayload").value = "";
                        console.log("消息发布成功");
                    } else {
                        alert("消息发布失败");
                    }
                } catch (err) {
                    console.error("发布消息时出错:", err);
                    alert("消息发布失败");
                }
            }

            function updateTopicHistory() {
                const datalist = document.getElementById("topicHistory");
                datalist.innerHTML = Array.from(state.topicHistory)
                    .map((topic) => `<option value="${topic}">`)
                    .join("");
            }

            // ==================== 配置管理 ====================
            async function loadConfig() {
                try {
                    const response = await fetch(
                        `${CONFIG.apiUrl}/api/configs`,
                        {
                            headers: {
                                Authorization: getAuthHeader(),
                            },
                        },
                    );

                    if (response.ok) {
                        const config = await response.json();
                        state.config = config;
                        renderConfigForm(config);
                    } else {
                        alert("加载配置失败");
                    }
                } catch (err) {
                    console.error("加载配置时出错:", err);
                    alert("加载配置失败");
                }
            }

            function renderConfigForm(config) {
                const form = document.getElementById("configForm");
                const configItems = [
                    {
                        key: "log_level",
                        label: "日志级别",
                        type: "number",
                        min: 0,
                        max: 4,
                    },
                    {
                        key: "stats_interval",
                        label: "统计间隔(秒)",
                        type: "number",
                        min: 1,
                    },
                    {
                        key: "enable_stats",
                        label: "启用统计",
                        type: "checkbox",
                    },
                    { key: "enable_api", label: "启用 API", type: "checkbox" },
                    {
                        key: "port",
                        label: "MQTT 端口",
                        type: "number",
                        min: 1024,
                        max: 65535,
                    },
                    {
                        key: "api_port",
                        label: "API 端口",
                        type: "number",
                        min: 1024,
                        max: 65535,
                    },
                    {
                        key: "timeout_ms",
                        label: "超时时间(ms)",
                        type: "number",
                        min: 1000,
                    },
                    {
                        key: "max_clients",
                        label: "最大客户端数",
                        type: "number",
                        min: 0,
                        full: true,
                    },
                    {
                        key: "max_subs",
                        label: "最大订阅数",
                        type: "number",
                        min: 0,
                    },
                    {
                        key: "max_retained",
                        label: "最大保留消息",
                        type: "number",
                        min: 0,
                    },
                    {
                        key: "rx_buf_sz",
                        label: "接收缓冲区",
                        type: "number",
                        min: 512,
                        full: true,
                    },
                    {
                        key: "tx_buf_sz",
                        label: "发送缓冲区",
                        type: "number",
                        min: 512,
                        full: true,
                    },
                    {
                        key: "max_payload_len",
                        label: "最大负载长度",
                        type: "number",
                        min: 128,
                        full: true,
                    },
                    { key: "use_tls", label: "启用 TLS", type: "checkbox" },
                    {
                        key: "use_ws",
                        label: "启用 WebSocket",
                        type: "checkbox",
                    },
                    {
                        key: "username",
                        label: "用户名",
                        type: "text",
                        full: true,
                    },
                    {
                        key: "password",
                        label: "密码",
                        type: "password",
                        full: true,
                    },
                    {
                        key: "api_token",
                        label: "API 令牌",
                        type: "text",
                        full: true,
                    },
                ];

                form.innerHTML = configItems
                    .map((item) => {
                        const value = config[item.key];
                        const fullWidth = item.full ? "config-full" : "";

                        let inputHtml = "";
                        if (item.type === "checkbox") {
                            inputHtml = `
                                <input type="checkbox"
                                       id="config_${item.key}"
                                       data-key="${item.key}"
                                       ${value ? "checked" : ""}>
                            `;
                        } else {
                            inputHtml = `
                                <input type="${item.type}"
                                       class="form-input"
                                       id="config_${item.key}"
                                       data-key="${item.key}"
                                       value="${
                                           value !== undefined ? value : ""
                                       }"
                                       ${
                                           item.min !== undefined
                                               ? `min="${item.min}"`
                                               : ""
                                       }
                                       ${
                                           item.max !== undefined
                                               ? `max="${item.max}"`
                                               : ""
                                       }>
                            `;
                        }

                        return `
                            <div class="form-group ${fullWidth}">
                                <label class="form-label">${item.label}</label>
                                ${inputHtml}
                            </div>
                        `;
                    })
                    .join("");
            }

            async function saveConfig() {
                const form = document.getElementById("configForm");
                const inputs = form.querySelectorAll("[data-key]");
                const formData = new URLSearchParams();

                inputs.forEach((input) => {
                    const key = input.dataset.key;
                    let value =
                        input.type === "checkbox" ? input.checked : input.value;

                    if (input.type === "number") {
                        value = parseInt(value) || 0;
                    }

                    formData.append(key, value);
                });

                if (
                    !confirm(
                        "确定要保存配置吗？某些更改可能需要重启 Broker 才能生效。",
                    )
                ) {
                    return;
                }

                try {
                    const response = await fetch(
                        `${CONFIG.apiUrl}/api/configs`,
                        {
                            method: "POST",
                            headers: {
                                Authorization: getAuthHeader(),
                                "Content-Type":
                                    "application/x-www-form-urlencoded",
                            },
                            body: formData.toString(),
                        },
                    );

                    if (response.ok) {
                        const result = await response.json();
                        if (result.success) {
                            alert("配置保存成功");
                            loadConfig();
                        } else {
                            alert(`保存失败: ${result.message || "未知错误"}`);
                        }
                    } else {
                        alert("配置保存失败");
                    }
                } catch (err) {
                    console.error("保存配置时出错:", err);
                    alert("配置保存失败");
                }
            }

            // ==================== 界面更新 ====================
            function updateConnectionUI() {
                const btn = document.getElementById("connectionBtn");
                const btnIcon = btn.querySelector(".btn-icon");
                const btnText = btn.querySelector(".btn-text");

                if (state.connecting) {
                    // 连接中状态
                    btn.className = "connection-btn connecting";
                    btnIcon.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
                        </svg>
                    `;
                    btnText.textContent = "正在连接...";
                    btn.title = "正在连接...";
                } else if (state.connected) {
                    // 已连接状态
                    btn.className = "connection-btn connected";
                    btnIcon.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                            <line x1="12" y1="2" x2="12" y2="12"/>
                        </svg>
                    `;
                    btnText.textContent = "已连接";
                    btn.title = "点击断开连接";
                } else {
                    // 已断开状态
                    btn.className = "connection-btn disconnected";
                    btnIcon.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
                            <line x1="2" y1="2" x2="22" y2="22"/>
                        </svg>
                    `;
                    btnText.textContent = "已断开";
                    btn.title = "点击连接";
                }
            }

            // ==================== 通知功能 ====================
            function showNotification(message, type = "success") {
                const container = document.getElementById("notificationContainer");

                // 移除现有通知
                const existingNotification = container.querySelector(".notification");
                if (existingNotification) {
                    existingNotification.remove();
                }

                // 创建新通知
                const notification = document.createElement("div");
                notification.className = `notification ${type}`;
                notification.textContent = message;

                container.appendChild(notification);

                // 3秒后自动隐藏
                setTimeout(() => {
                    notification.classList.add("hide");
                    setTimeout(() => {
                        notification.remove();
                    }, 300);
                }, 3000);
            }

            function toggleConnection() {
                if (state.connected) {
                    // 人为断开，设置标志位防止自动重连
                    state.manualDisconnect = true;
                    if (state.mqttClient) {
                        state.mqttClient.end();
                    }
                } else if (!state.connecting) {
                    // 只有在非连接状态下才允许连接
                    state.manualDisconnect = false;
                    initMqttClient();
                }
            }

            function switchModule(moduleName) {
                state.currentModule = moduleName;

                // 更新导航项
                document.querySelectorAll(".nav-item").forEach((item) => {
                    item.classList.toggle(
                        "active",
                        item.dataset.module === moduleName,
                    );
                });

                // 更新模块显示
                document.querySelectorAll(".module").forEach((module) => {
                    module.classList.toggle(
                        "active",
                        module.id === `${moduleName}Module`,
                    );
                });

                // 切换到配置模块时加载配置
                if (moduleName === "config") {
                    loadConfig();
                }
            }

            function toggleTheme() {
                state.theme = state.theme === "light" ? "dark" : "light";
                document.documentElement.setAttribute(
                    "data-theme",
                    state.theme,
                );
                const toggleBtn = document.getElementById("themeToggle");
                if (state.theme === "dark") {
                    toggleBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    `;
                } else {
                    toggleBtn.innerHTML = `
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="4"/>
                            <path d="M12 2v2"/>
                            <path d="M12 20v2"/>
                            <path d="m4.93 4.93 1.41 1.41"/>
                            <path d="m17.66 17.66 1.41 1.41"/>
                            <path d="M2 12h2"/>
                            <path d="M20 12h2"/>
                            <path d="m6.34 17.66-1.41 1.41"/>
                            <path d="m19.07 4.93-1.41 1.41"/>
                        </svg>
                    `;
                }
            }

            // ==================== 模态框操作 ====================
            function showAddSubModal() {
                document.getElementById("addSubModal").classList.add("active");
                document.getElementById("subTopicInput").focus();
            }

            function hideAddSubModal() {
                document
                    .getElementById("addSubModal")
                    .classList.remove("active");
                document.getElementById("subTopicInput").value = "";
                document.getElementById("subQosInput").value = "0";
            }

            function confirmAddSubscription() {
                const topic = document
                    .getElementById("subTopicInput")
                    .value.trim();
                const qos = parseInt(
                    document.getElementById("subQosInput").value,
                );

                if (!topic) {
                    alert("请输入主题");
                    return;
                }

                // 验证主题格式
                if (!/^[a-zA-Z0-9_#/+$]+$/.test(topic)) {
                    alert("主题格式无效");
                    return;
                }

                addSubscription(topic, qos);
                hideAddSubModal();
            }

            // ==================== 事件监听 ====================
            document.addEventListener("DOMContentLoaded", () => {
                // 导航菜单
                document.querySelectorAll(".nav-item").forEach((item) => {
                    item.addEventListener("click", () =>
                        switchModule(item.dataset.module),
                    );
                });

                // 连接控制
                document
                    .getElementById("connectionBtn")
                    .addEventListener("click", toggleConnection);
                document
                    .getElementById("themeToggle")
                    .addEventListener("click", toggleTheme);

                // 首页模块
                document
                    .getElementById("clearLogsBtn")
                    .addEventListener("click", clearLogs);
                document
                    .getElementById("refreshClientsBtn")
                    .addEventListener("click", refreshClients);
                document
                    .getElementById("kickAllBtn")
                    .addEventListener("click", kickAllClients);

                // 消息模块
                document
                    .getElementById("addSubBtn")
                    .addEventListener("click", showAddSubModal);
                document
                    .getElementById("publishBtn")
                    .addEventListener("click", publishMessage);

                // 日志模块
                document
                    .getElementById("clearSystemLogsBtn")
                    .addEventListener("click", clearSystemLogs);

                // 配置模块
                document
                    .getElementById("saveConfigBtn")
                    .addEventListener("click", saveConfig);

                // 模态框事件
                document
                    .getElementById("cancelSubBtn")
                    .addEventListener("click", hideAddSubModal);
                document
                    .getElementById("confirmSubBtn")
                    .addEventListener("click", confirmAddSubscription);
                document
                    .getElementById("addSubModal")
                    .addEventListener("click", (e) => {
                        if (e.target.id === "addSubModal") hideAddSubModal();
                    });

                // 回车键确认订阅
                document
                    .getElementById("subTopicInput")
                    .addEventListener("keypress", (e) => {
                        if (e.key === "Enter") confirmAddSubscription();
                    });

                // 初始化
                updateConnectionUI();
                if (CONFIG.autoConnect) {
                    initMqttClient();
                }

                // 初始加载客户端列表
                refreshClients();
            });
        </script>
    </body>
</html>
