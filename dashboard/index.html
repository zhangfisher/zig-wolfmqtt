<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MQTT Broker 控制台</title>
        <script src="mqtt.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                /* 科技蓝配色方案 - 清新明亮 */
                --primary-blue: #2196f3;
                --secondary-blue: #03a9f4;
                --accent-cyan: #00bcd4;
                --accent-glow: rgba(33, 150, 243, 0.1);
                --error-red: #ef4444;

                /* 梯度背景系统 - 错落有致 */
                --bg-level-0: #f1f5f9; /* 最外层 - 最浅 */
                --bg-level-1: #ffffff; /* module容器 */
                --bg-level-2: #f8fafc; /* panel面板 */
                --bg-level-3: #f1f5f9; /* 卡片/列表项 */
                --bg-level-4: #e2e8f0; /* 输入框/二级元素 */

                --bg-primary: var(--bg-level-0);
                --bg-secondary: var(--bg-level-1);
                --bg-tertiary: var(--bg-level-2);
                --bg-card: var(--bg-level-3);
                --bg-input: var(--bg-level-4);

                --text-primary: #475569;
                --text-secondary: #64748b;
                --text-muted: #94a3b8;
                --border-color: #e2e8f0;
                --border-focus: var(--primary-blue);

                /* 阴影梯度 - 增强层次感 */
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
                --shadow-md:
                    0 2px 4px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
                --shadow-lg:
                    0 4px 8px rgba(0, 0, 0, 0.08), 0 2px 4px rgba(0, 0, 0, 0.04);
                --shadow-xl:
                    0 8px 16px rgba(0, 0, 0, 0.1), 0 4px 8px rgba(0, 0, 0, 0.06);
                --input-shadow: 0 0 0 3px rgba(33, 150, 243, 0.12);

                /* 字体 */
                --font-body:
                    "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
                --font-mono: "JetBrains Mono", monospace;
            }

            [data-theme="dark"] {
                /* 暗色模式梯度背景 */
                --bg-level-0: #0f172a; /* 最外层 - 最深 */
                --bg-level-1: #1e293b; /* module容器 */
                --bg-level-2: #334155; /* panel面板 */
                --bg-level-3: #475569; /* 卡片/列表项 */
                --bg-level-4: #64748b; /* 输入框/二级元素 */

                --bg-primary: var(--bg-level-0);
                --bg-secondary: var(--bg-level-1);
                --bg-tertiary: var(--bg-level-2);
                --bg-card: var(--bg-level-3);
                --bg-input: var(--bg-level-4);

                --text-primary: #e2e8f0;
                --text-secondary: #cbd5e1;
                --text-muted: #94a3b8;
                --border-color: #475569;

                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-md:
                    0 2px 4px rgba(0, 0, 0, 0.4), 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-lg:
                    0 4px 8px rgba(0, 0, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 0.3);
                --shadow-xl:
                    0 8px 16px rgba(0, 0, 0, 0.6), 0 4px 8px rgba(0, 0, 0, 0.4);
                --input-shadow: 0 0 0 3px rgba(33, 150, 243, 0.25);
            }

            [data-theme="dark"] .form-input,
            [data-theme="dark"] .form-select {
                background: var(--bg-input);
            }

            [data-theme="dark"] .form-input:focus,
            [data-theme="dark"] .form-select:focus {
                background: var(--bg-input);
            }

            [data-theme="dark"] .form-textarea {
                background: var(--bg-input);
            }

            [data-theme="dark"] .form-textarea:focus {
                background: var(--bg-input);
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: var(--font-body);
                background: var(--bg-primary);
                color: var(--text-primary);
                line-height: 1.6;
                min-height: 100vh;
                transition:
                    background 0.3s ease,
                    color 0.3s ease;
            }

            .app-container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 24px;
            }

            /* 顶部导航栏 */
            .header {
                background: var(--bg-secondary);
                border-radius: 12px;
                padding: 20px 24px;
                margin-bottom: 24px;
                box-shadow: var(--shadow-md);
                border: 1px solid var(--border-color);
                position: relative;
                z-index: 10;
            }

            .header-content {
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 20px;
            }

            .header-title {
                font-size: 20px;
                font-weight: 600;
                color: var(--primary-blue);
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .header-nav {
                display: flex;
                gap: 4px;
                flex-wrap: wrap;
            }

            .nav-item {
                padding: 8px 16px;
                background: transparent;
                border-radius: 6px;
                color: var(--text-secondary);
                cursor: pointer;
                transition: all 0.2s ease;
                font-size: 14px;
                font-weight: 500;
            }

            .nav-item:hover {
                background: var(--bg-tertiary);
                color: var(--primary-blue);
            }

            .nav-item.active {
                background: var(--primary-blue);
                color: #ffffff;
            }

            .header-controls {
                display: flex;
                gap: 12px;
                align-items: center;
            }

            .connection-btn {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px 16px;
                background: #3b82f6;
                color: #ffffff;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
                font-weight: 500;
                transition: all 0.2s ease;
                min-width: 120px;
                justify-content: center;
            }

            .connection-btn .btn-icon {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 16px;
                height: 16px;
            }

            .connection-btn .btn-icon svg {
                width: 16px;
                height: 16px;
            }

            /* 连接中状态 - 旋转动画 */
            .connection-btn.connecting {
                background: #f59e0b;
                cursor: not-allowed;
            }

            .connection-btn.connecting .btn-icon {
                animation: spin 1s linear infinite;
            }

            @keyframes spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }

            /* 已连接状态 */
            .connection-btn.connected {
                background: #22c55e;
            }

            /* 已断开状态 - 红色背景 */
            .connection-btn.disconnected {
                background: #ef4444;
            }

            .connection-btn:hover:not(.connecting) {
                opacity: 0.9;
                transform: translateY(-1px);
            }

            /* 通知框 */
            .notification {
                position: fixed;
                top: 110px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 500;
                z-index: 1000;
                box-shadow: var(--shadow-lg);
                animation: slideDown 0.3s ease;
                max-width: 400px;
                text-align: center;
            }

            .notification.success {
                background: #dcfce7;
                color: #166534;
                border: 1px solid #86efac;
            }

            .notification.error {
                background: #fee2e2;
                color: #991b1b;
                border: 1px solid #fca5a5;
            }

            .notification.hide {
                animation: slideUp 0.3s ease forwards;
            }

            @keyframes slideDown {
                from {
                    opacity: 0;
                    transform: translateX(-50%) translateY(-20px);
                }
                to {
                    opacity: 1;
                    transform: translateX(-50%) translateY(0);
                }
            }

            @keyframes slideUp {
                from {
                    opacity: 1;
                    transform: translateX(-50%) translateY(0);
                }
                to {
                    opacity: 0;
                    transform: translateX(-50%) translateY(-20px);
                }
            }

            [data-theme="dark"] .notification.success {
                background: #14532d;
                color: #dcfce7;
                border: 1px solid #22c55e;
            }

            [data-theme="dark"] .notification.error {
                background: #7f1d1d;
                color: #fee2e2;
                border: 1px solid #ef4444;
            }

            .theme-toggle {
                width: 36px;
                height: 36px;
                border-radius: 6px;
                background: var(--bg-card);
                border: 1px solid var(--border-color);
                color: var(--text-secondary);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s ease;
            }

            .theme-toggle:hover {
                background: var(--bg-tertiary);
                border-color: var(--border-focus);
            }

            /* 模块容器 */
            .module-container {
                background: var(--bg-secondary);
                border-radius: 12px;
                padding: 24px;
                box-shadow: var(--shadow-lg);
                border: 1px solid var(--border-color);
                position: relative;
                z-index: 5;
            }

            .module {
                display: none;
            }

            .module.active {
                display: block;
                animation: fadeIn 0.2s ease;
            }

            @keyframes fadeIn {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            /* 统计卡片网格 */
            .stats-grid {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 16px;
                margin-bottom: 24px;
            }

            .stat-card {
                background: var(--bg-card);
                border: 1px solid var(--border-color);
                border-radius: 12px;
                padding: 20px;
                transition: all 0.3s ease;
                box-shadow: var(--shadow-sm);
                position: relative;
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .stat-card:hover {
                box-shadow: var(--shadow-lg);
                transform: translateY(-2px);
            }

            .stat-label {
                font-size: 12px;
                color: var(--text-muted);
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            .stat-content {
                display: flex;
                flex-direction: row;
                align-items: center;
                gap: 16px;
            }

            .stat-icon {
                width: 56px;
                height: 56px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                flex-grow: 0;
                transition: all 0.3s ease;
            }

            .stat-card:hover .stat-icon {
                transform: scale(1.1) rotate(5deg);
            }

            .stat-icon svg {
                width: 28px;
                height: 28px;
            }

            .stat-info {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .stat-value {
                font-size: 20px;
                font-weight: 700;
                color: var(--text-secondary);
                line-height: 1;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .stat-detail {
                font-size: 11px;
                color: var(--text-muted);
            }

            /* 不同卡片的图标颜色 - 更鲜艳的渐变 */
            .stat-card.connections .stat-icon {
                background: linear-gradient(135deg, #60a5fa, #3b82f6, #2563eb);
                color: #ffffff;
            }

            .stat-card.messages .stat-icon {
                background: linear-gradient(135deg, #34d399, #10b981, #059669);
                color: #ffffff;
            }

            .stat-card.bytes .stat-icon {
                background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
                color: #ffffff;
            }

            .stat-card.retained .stat-icon {
                background: linear-gradient(135deg, #a78bfa, #8b5cf6, #7c3aed);
                color: #ffffff;
            }

            .stat-card.subscriptions .stat-icon {
                background: linear-gradient(135deg, #f472b6, #ec4899, #db2777);
                color: #ffffff;
            }

            /* 两列布局 */
            .two-column {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 16px;
            }

            .panel {
                background: var(--bg-tertiary);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                overflow: hidden;
                box-shadow: var(--shadow-sm);
            }

            .panel-header {
                background: var(--bg-card);
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid var(--border-color);
            }

            .panel-title {
                font-size: 13px;
                font-weight: 600;
                color: var(--text-primary);
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .panel-title svg {
                width: 16px;
                height: 16px;
                color: var(--primary-blue);
            }

            .panel-actions {
                display: flex;
                gap: 6px;
            }

            .panel-btn {
                background: var(--bg-card);
                border: 1px solid var(--border-color);
                border-radius: 4px;
                padding: 4px 10px;
                color: var(--text-secondary);
                cursor: pointer;
                font-size: 12px;
                transition: all 0.2s ease;
            }

            .panel-btn:hover {
                background: var(--primary-blue);
                color: #ffffff;
                border-color: var(--primary-blue);
                box-shadow: var(--shadow-sm);
            }

            .panel-content {
                padding: 12px;
                max-height: 360px;
                overflow-y: auto;
            }

            /* 滚动条 */
            .panel-content::-webkit-scrollbar {
                width: 6px;
            }

            .panel-content::-webkit-scrollbar-track {
                background: var(--bg-tertiary);
                border-radius: 3px;
            }

            .panel-content::-webkit-scrollbar-thumb {
                background: var(--border-color);
                border-radius: 3px;
            }

            .panel-content::-webkit-scrollbar-thumb:hover {
                background: var(--text-muted);
            }

            /* 日志条目 */
            .log-item {
                padding: 10px;
                margin-bottom: 6px;
                background: var(--bg-card);
                border-radius: 4px;
                font-family: var(--font-mono);
                font-size: 11px;
                display: flex;
                gap: 10px;
                align-items: flex-start;
                border: 1px solid transparent;
                transition: all 0.2s ease;
            }

            .log-item:hover {
                background: var(--bg-tertiary);
                border-color: var(--border-color);
            }

            .log-time {
                color: var(--text-muted);
                font-size: 10px;
                min-width: 70px;
            }

            .log-message {
                color: var(--text-primary);
                flex: 1;
                word-break: break-word;
            }

            /* 客户端列表 */
            .client-item {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 10px;
                margin-bottom: 6px;
                background: var(--bg-card);
                border-radius: 4px;
                transition: all 0.2s ease;
                border: 1px solid transparent;
            }

            .client-item:hover {
                background: var(--bg-tertiary);
                border-color: var(--border-color);
            }

            .client-icon {
                width: 32px;
                height: 32px;
                border-radius: 6px;
                background: var(--primary-blue);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .client-icon svg {
                width: 16px;
                height: 16px;
                color: #ffffff;
            }

            .client-info {
                flex: 1;
            }

            .client-id {
                font-family: var(--font-mono);
                font-size: 12px;
                font-weight: 500;
                color: var(--text-primary);
                margin-bottom: 2px;
            }

            .client-details {
                display: flex;
                gap: 8px;
                font-size: 10px;
                color: var(--text-muted);
            }

            .client-type {
                padding: 2px 6px;
                border-radius: 3px;
                background: var(--bg-secondary);
                font-weight: 500;
            }

            /* 消息模块 */
            .message-container {
                display: grid;
                grid-template-columns: 240px 1fr;
                gap: 16px;
            }

            .subscribe-panel {
                background: var(--bg-tertiary);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                overflow: hidden;
                display: flex;
                flex-direction: column;
                min-height: 300px;
                max-height: 500px;
                box-shadow: var(--shadow-sm);
            }

            .subscribe-header {
                background: var(--bg-card);
                padding: 12px 16px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                border-bottom: 1px solid var(--border-color);
            }

            .subscribe-title {
                font-size: 13px;
                font-weight: 600;
                color: var(--text-primary);
            }

            .add-sub-btn {
                width: 24px;
                height: 24px;
                border-radius: 4px;
                background: var(--primary-blue);
                border: none;
                color: #ffffff;
                font-size: 16px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.2s ease;
                box-shadow: var(--shadow-sm);
            }

            .add-sub-btn:hover {
                opacity: 0.9;
                box-shadow: var(--shadow-md);
            }

            .subscribe-list {
                flex: 1;
                overflow-y: auto;
                padding: 8px;
            }

            .subscribe-list::-webkit-scrollbar {
                width: 4px;
            }

            .subscribe-list::-webkit-scrollbar-track {
                background: transparent;
            }

            .subscribe-list::-webkit-scrollbar-thumb {
                background: var(--border-color);
                border-radius: 2px;
            }

            .subscribe-list::-webkit-scrollbar-thumb:hover {
                background: var(--text-muted);
            }

            .subscribe-item {
                padding: 8px 10px;
                margin-bottom: 6px;
                background: var(--bg-card);
                border-radius: 4px;
                transition: all 0.2s ease;
                border: 1px solid transparent;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .subscribe-item:hover {
                background: var(--bg-tertiary);
                border-color: var(--border-color);
            }

            .subscribe-item.active {
                background: rgba(33, 150, 243, 0.1);
                border-color: var(--primary-blue);
            }

            .subscribe-checkbox {
                width: 16px;
                height: 16px;
                border-radius: 3px;
                border: 2px solid var(--text-muted);
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-shrink: 0;
                transition: all 0.2s ease;
            }

            .subscribe-checkbox.checked {
                background: var(--primary-blue);
                border-color: var(--primary-blue);
            }

            .subscribe-checkbox svg {
                width: 10px;
                height: 10px;
                color: #ffffff;
                opacity: 0;
                transition: opacity 0.2s ease;
            }

            .subscribe-checkbox.checked svg {
                opacity: 1;
            }

            .subscribe-content {
                flex: 1;
                min-width: 0;
                cursor: pointer;
            }

            .subscribe-topic {
                font-family: var(--font-mono);
                font-size: 11px;
                font-weight: 500;
                margin-bottom: 2px;
                word-break: break-all;
            }

            .subscribe-qos {
                font-size: 9px;
                color: var(--text-muted);
            }

            .subscribe-delete {
                width: 20px;
                height: 20px;
                border-radius: 3px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text-muted);
                transition: all 0.2s ease;
                flex-shrink: 0;
            }

            .subscribe-delete:hover {
                background: var(--error-red);
                color: #ffffff;
            }

            .subscribe-delete svg {
                width: 12px;
                height: 12px;
            }

            .message-panel {
                display: flex;
                flex-direction: column;
                gap: 12px;
                min-height: 300px;
            }

            .message-list {
                flex: 1;
                min-height: 300px;
                max-height: 500px;
                background: var(--bg-tertiary);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                padding: 12px;
                overflow-y: auto;
            }

            .message-list::-webkit-scrollbar {
                width: 4px;
            }

            .message-list::-webkit-scrollbar-track {
                background: transparent;
            }

            .message-list::-webkit-scrollbar-thumb {
                background: var(--border-color);
                border-radius: 2px;
            }

            .message-list::-webkit-scrollbar-thumb:hover {
                background: var(--text-muted);
            }

            .message-item {
                margin-bottom: 12px;
                display: flex;
                gap: 10px;
                animation: slideIn 0.2s ease;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateX(-10px);
                }
                to {
                    opacity: 1;
                    transform: translateX(0);
                }
            }

            .message-avatar {
                width: 32px;
                height: 32px;
                border-radius: 6px;
                background: var(--accent-cyan);
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 10px;
                flex-shrink: 0;
                font-weight: 600;
                color: #ffffff;
            }

            .message-content {
                flex: 1;
            }

            .message-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 4px;
            }

            .message-topic {
                font-family: var(--font-mono);
                font-size: 11px;
                font-weight: 500;
                color: var(--primary-blue);
            }

            .message-time {
                font-size: 9px;
                color: var(--text-muted);
            }

            .message-body {
                background: var(--bg-card);
                padding: 8px 10px;
                border-radius: 4px;
                font-family: var(--font-mono);
                font-size: 11px;
                color: var(--text-primary);
                word-break: break-word;
                border: 1px solid var(--border-color);
            }

            .message-body.hex {
                color: var(--accent-cyan);
            }

            .publish-area {
                background: var(--bg-tertiary);
                border: 1px solid var(--border-color);
                border-radius: 8px;
                padding: 12px;
            }

            .publish-form {
                display: grid;
                grid-template-columns: 2fr 1fr 1fr 1fr;
                gap: 10px;
                margin-bottom: 10px;
            }

            .form-group {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .form-label {
                font-size: 10px;
                color: var(--text-muted);
                font-weight: 500;
            }

            .form-input,
            .form-select {
                padding: 8px 10px;
                background: #ffffff;
                border: 1px solid var(--border-color);
                border-radius: 4px;
                color: var(--text-primary);
                font-size: 13px;
                transition: all 0.2s ease;
                outline: none;
            }

            .form-input:focus,
            .form-select:focus {
                border-color: var(--border-focus);
                box-shadow: var(--input-shadow);
                transform: translateY(-1px);
                background: #ffffff;
            }

            .form-textarea {
                width: 100%;
                min-height: 60px;
                padding: 8px 10px;
                background: #ffffff;
                border: 1px solid var(--border-color);
                border-radius: 4px;
                color: var(--text-primary);
                font-family: var(--font-mono);
                font-size: 11px;
                resize: vertical;
                transition: all 0.2s ease;
                outline: none;
            }

            .form-textarea:focus {
                border-color: var(--border-focus);
                box-shadow: var(--input-shadow);
                transform: translateY(-1px);
                background: #ffffff;
            }

            .publish-btn {
                padding: 8px 16px;
                background: var(--primary-blue);
                border: none;
                border-radius: 4px;
                color: #ffffff;
                font-size: 13px;
                font-weight: 500;
                cursor: pointer;
                transition: all 0.2s ease;
                align-self: flex-start;
                box-shadow: var(--shadow-sm);
            }

            .publish-btn:hover {
                opacity: 0.9;
                box-shadow: var(--shadow-md);
            }

            /* 配置模块 */
            .config-container {
                max-width: 700px;
                margin: 0 auto;
            }

            .config-form {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }

            .config-full {
                grid-column: 1 / -1;
            }

            /* 空状态 */
            .empty-state {
                text-align: center;
                padding: 32px 16px;
                color: var(--text-muted);
            }

            .empty-icon {
                margin-bottom: 12px;
                opacity: 0.5;
            }

            .empty-icon svg {
                width: 40px;
                height: 40px;
            }

            .empty-text {
                font-size: 13px;
            }

            /* 响应式 */
            @media (max-width: 1024px) {
                .two-column {
                    grid-template-columns: 1fr;
                }

                .message-container {
                    grid-template-columns: 1fr;
                }

                .subscribe-panel {
                    max-height: 300px;
                }
            }

            @media (max-width: 768px) {
                .header-content {
                    flex-direction: column;
                    align-items: stretch;
                }

                .header-nav {
                    justify-content: center;
                }

                .header-controls {
                    justify-content: center;
                }

                .stats-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .config-form {
                    grid-template-columns: 1fr;
                }
            }

            /* 模态框 */
            .modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.4);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                backdrop-filter: blur(2px);
            }

            .modal-overlay.active {
                display: flex;
            }

            .modal {
                background: var(--bg-secondary);
                border-radius: 8px;
                padding: 24px;
                max-width: 400px;
                width: 90%;
                box-shadow: var(--shadow-xl);
                animation: modalIn 0.2s ease;
                border: 1px solid var(--border-color);
            }

            @keyframes modalIn {
                from {
                    opacity: 0;
                    transform: scale(0.95);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            .modal-title {
                font-size: 16px;
                font-weight: 600;
                margin-bottom: 16px;
                color: var(--text-primary);
            }

            .modal-actions {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
                margin-top: 16px;
            }

            .btn {
                padding: 8px 16px;
                border-radius: 4px;
                font-size: 13px;
                cursor: pointer;
                transition: all 0.2s ease;
                border: none;
                font-weight: 500;
            }

            .btn-primary {
                background: var(--primary-blue);
                color: #ffffff;
            }

            .btn-primary:hover {
                opacity: 0.9;
            }

            .btn-secondary {
                background: var(--bg-card);
                color: var(--text-primary);
                border: 1px solid var(--border-color);
            }

            .btn-secondary:hover {
                background: var(--bg-tertiary);
            }

        </style>
    </head>
